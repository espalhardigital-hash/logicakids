name: LogicaKids Pro CI

on:
  push:
    branches: [ producion, main, master, dev ]
  pull_request:
    branches: [ producion, main, master, dev ]

jobs:
  frontend-check:
    name: Frontend TypeScript & Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: LogicaMath/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd LogicaMath/frontend && npm ci

      - name: TypeScript Type Check
        run: cd LogicaMath/frontend && npx tsc --noEmit

  backend-check:
    name: Backend Syntax & Imports Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f LogicaMath/backend/requirements.txt ]; then pip install -r LogicaMath/backend/requirements.txt; fi

      - name: Verify Python Compilation
        run: |
          python -m py_compile LogicaMath/backend/app/main.py
          python -m py_compile LogicaMath/backend/app/seed.py
